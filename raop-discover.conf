# How PipeWire should set up the AirPlay sinks it discovers over mDNS.
#
# THE ROOMS MUST STAY IN PHASE WITH EACH OTHER. That is the whole point of the
# app, and it is also the easiest thing to break, because the two engines buffer
# differently:
#
#   OwnTone   start_buffer_ms = 2250 ms   (its default, hardcoded for the sake
#                                          of old AirPlay hardware)
#   PipeWire  loopback ~133 ms + sess.latency.msec
#
# With sess.latency.msec = 447 the PipeWire path sat at ~580 ms against
# OwnTone's 2250 - a 1.7 second echo between the kitchen and the bedroom.
#
# Do not count in the milliseconds you want, but in what PipeWire actually does:
#
#   sess.latency.msec is ROUNDED DOWN to whole RAOP packets of 352 samples.
#   Ask for 2250.884 and you get 281 packets = 98912/44100 = 2242.9 ms. It shows
#   up as node.latency on the sink in `pactl list sinks`.
#
#   The loopback adds its own. latency_msec=400 came out as 6400/48000 = 133 ms,
#   not 400 - PipeWire picks its own period size.
#
# 2119 rounds to 265 packets = 2115 ms, plus the loopback's 133 = 2248 ms, about
# a millisecond from OwnTone's 2250.
#
# To adjust by ear, run ./sync.sh - it keeps these numbers together. Individual
# OwnTone rooms are trimmed from the info button in the app.
#
# The transport is deliberately left at the default of udp. TCP was tried when
# the porch Pi was losing 4-40 % of its packets, but shairport-sync answered with
# "mod.raop-sink: timestamp: expected ... != actual ..." and PipeWire dropped the
# sink entirely - the device vanished from pactl. The packet loss turned out to
# come from an undersized power supply (1 A to a Pi 3 that wants 2.5 A); with
# 5 V/3 A it loses none. Fix the power and the network, not the transport.
context.modules = [
  { name = libpipewire-module-raop-discover
    args = {
      stream.rules = [
        { matches = [ { raop.ip = "~.*" } ]
          actions = {
            create-stream = {
              sess.latency.msec = 2115
            }
          }
        }
      ]
    }
  }
]
